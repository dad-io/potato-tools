; =====================================================================
;  SystemHMI - Panel.ini  (NUC variant)
;  NUC11PAHi5 | i5-1135G7 | Iris Xe (iGPU) | 16GB RAM | C:
;  Fibb Crystal Dark theme. Right-edge strip, 2560x1080. Drag to reposition.
; =====================================================================

[Rainmeter]
Update=1000
AccurateText=1
DynamicWindowSize=1
MouseOverAction=[!SetOption MeterBg Shape "Rectangle 0,0,#PanelW#,#PanelHExp#,#Radius# | Fill Color #Bg# | StrokeWidth 1 | Stroke Color #PanelEdge#"][!ShowMeterGroup Detail][!UpdateMeter MeterBg][!Redraw]
MouseLeaveAction=[!SetOption MeterBg Shape "Rectangle 0,0,#PanelW#,#PanelHcmp#,#Radius# | Fill Color #Bg# | StrokeWidth 1 | Stroke Color #PanelEdge#"][!HideMeterGroup Detail][!UpdateMeter MeterBg][!Redraw]
OnRefreshAction=["#Launcher#" "#Poller#" "#DataFile#"]
@IncludeVariables=#@#Variables.inc
@IncludeStyles=#@#Styles.inc
@IncludeTheme=#@#Themes\FibbCrystalDark.inc

[Variables]
PanelHcmp=630
PanelHExp=818
PanelH=818

[Metadata]
Name=SystemHMI (NUC, Fibb Crystal Dark)
Author=built with Claude
Information=Glanceable HMI system monitor. Drag to move.
Version=1.0

; =====================================================================
;  MEASURES
; =====================================================================

; ---- GPU: Iris Xe via poll.ps1 (PDH GPU Engine + shared memory) ----
[MGpuUtilS]
Measure=Plugin
Plugin=WebParser
URL=file://#DataFile#
RegExp=(?siU)GPUUTIL=(.*)\r?\n
StringIndex=1
UpdateRate=2
ForceReload=1
[MGpuMemUsedS]
Measure=Plugin
Plugin=WebParser
URL=file://#DataFile#
RegExp=(?siU)GPUMEMUSED=(.*)\r?\n
StringIndex=1
UpdateRate=2
ForceReload=1
[MGpuMemTotalS]
Measure=Plugin
Plugin=WebParser
URL=file://#DataFile#
RegExp=(?siU)GPUMEMTOTAL=(.*)\r?\n
StringIndex=1
UpdateRate=2
ForceReload=1
[MGpuUtil]
Measure=Calc
Formula=[MGpuUtilS]
DynamicVariables=1
MinValue=0
MaxValue=100
[MGpuMemUsed]
Measure=Calc
Formula=[MGpuMemUsedS]
DynamicVariables=1
[MGpuMemUsedGB]
Measure=Calc
Formula=(MGpuMemUsed/1024)
DynamicVariables=1
[MGpuMemTotalGB]
Measure=Calc
Formula=([MGpuMemTotalS]/1024)
DynamicVariables=1
[MGpuMemPct]
Measure=Calc
Formula=([MGpuMemTotalS] > 0 ? (MGpuMemUsed/[MGpuMemTotalS]*100) : 0)
DynamicVariables=1
MinValue=0
MaxValue=100
; iGPU shares the CPU package/temperature; keep MGpuTemp at 0 so the status LED ignores it
[MGpuTemp]
Measure=Calc
Formula=0
[MCpuData]
Measure=Plugin
Plugin=WebParser
URL=file://#DataFile#
RegExp=(?siU)CPUTEMP=(.*)\r?\n
StringIndex=1
UpdateRate=2
ForceReload=1
[MCpuTempN]
Measure=Calc
Formula=[MCpuData]
DynamicVariables=1
MinValue=0
MaxValue=100
IfCondition=(MCpuTempN>=#CpuTCrit#)
IfTrueAction=[!SetOption MeterCpuTempVal FontColor #Crit#][!UpdateMeter MeterCpuTempVal][!Redraw]
IfCondition2=(MCpuTempN>=#CpuTWarn#)&&(MCpuTempN<#CpuTCrit#)
IfTrueAction2=[!SetOption MeterCpuTempVal FontColor #Warn#][!UpdateMeter MeterCpuTempVal][!Redraw]
IfCondition3=(MCpuTempN<#CpuTWarn#)
IfTrueAction3=[!SetOption MeterCpuTempVal FontColor #OK#][!UpdateMeter MeterCpuTempVal][!Redraw]
[MCpuTop]
Measure=Plugin
Plugin=WebParser
URL=file://#DataFile#
RegExp=(?siU)CPUTOP=(.*)\r?\n
StringIndex=1
UpdateRate=2
ForceReload=1
[MRamTop]
Measure=Plugin
Plugin=WebParser
URL=file://#DataFile#
RegExp=(?siU)RAMTOP=(.*)\r?\n
StringIndex=1
UpdateRate=2
ForceReload=1
[MVramTop]
Measure=Plugin
Plugin=WebParser
URL=file://#DataFile#
RegExp=(?siU)VRAMTOP=(.*)\r?\n
StringIndex=1
UpdateRate=2
ForceReload=1
[MStatus]
Measure=Calc
DynamicVariables=1
Formula=( ((MCpu>=#CpuCrit#)||(MCpuTempN>=#CpuTCrit#)||(MGpuTemp>=#GpuTCrit#)||(MRamPct>=#RamCrit#)) ? 2 : ( ((MCpu>=#CpuWarn#)||(MCpuTempN>=#CpuTWarn#)||(MGpuTemp>=#GpuTWarn#)||(MRamPct>=#RamWarn#)) ? 1 : 0 ) )
IfCondition=(MStatus=2)
IfTrueAction=[!SetOption MeterLED FontColor #Crit#][!SetOption MeterStatus FontColor #Crit#][!SetOption MeterStatus Text "CRITICAL"][!UpdateMeter MeterLED][!UpdateMeter MeterStatus][!Redraw]
IfCondition2=(MStatus=1)
IfTrueAction2=[!SetOption MeterLED FontColor #Warn#][!SetOption MeterStatus FontColor #Warn#][!SetOption MeterStatus Text "WARNING"][!UpdateMeter MeterLED][!UpdateMeter MeterStatus][!Redraw]
IfCondition3=(MStatus=0)
IfTrueAction3=[!SetOption MeterLED FontColor #OK#][!SetOption MeterStatus FontColor #OK#][!SetOption MeterStatus Text "SYSTEM OK"][!UpdateMeter MeterLED][!UpdateMeter MeterStatus][!Redraw]
; ---- CPU ----
[MCpu]
Measure=CPU
IfCondition=(MCpu>=#CpuCrit#)
IfTrueAction=[!SetOption MeterCpuVal FontColor #Crit#][!SetOption MeterCpuBar BarColor #Crit#][!UpdateMeter MeterCpuVal][!UpdateMeter MeterCpuBar][!Redraw]
IfCondition2=(MCpu>=#CpuWarn#)&&(MCpu<#CpuCrit#)
IfTrueAction2=[!SetOption MeterCpuVal FontColor #Warn#][!SetOption MeterCpuBar BarColor #Warn#][!UpdateMeter MeterCpuVal][!UpdateMeter MeterCpuBar][!Redraw]
IfCondition3=(MCpu<#CpuWarn#)
IfTrueAction3=[!SetOption MeterCpuVal FontColor #Text#][!SetOption MeterCpuBar BarColor #Accent#][!UpdateMeter MeterCpuVal][!UpdateMeter MeterCpuBar][!Redraw]
[MCpu1]
Measure=CPU
Processor=1
[MCpu2]
Measure=CPU
Processor=2
[MCpu3]
Measure=CPU
Processor=3
[MCpu4]
Measure=CPU
Processor=4
[MCpu5]
Measure=CPU
Processor=5
[MCpu6]
Measure=CPU
Processor=6
[MCpu7]
Measure=CPU
Processor=7
[MCpu8]
Measure=CPU
Processor=8

; ---- RAM ----
[MRam]
Measure=PhysicalMemory
[MRamTotal]
Measure=PhysicalMemory
Total=1
[MRamPct]
Measure=Calc
Formula=(MRam/MRamTotal*100)
DynamicVariables=1
MinValue=0
MaxValue=100
IfCondition=(MRamPct>=#RamCrit#)
IfTrueAction=[!SetOption MeterRamVal FontColor #Crit#][!SetOption MeterRamBar BarColor #Crit#][!UpdateMeter MeterRamVal][!UpdateMeter MeterRamBar][!Redraw]
IfCondition2=(MRamPct>=#RamWarn#)&&(MRamPct<#RamCrit#)
IfTrueAction2=[!SetOption MeterRamVal FontColor #Warn#][!SetOption MeterRamBar BarColor #Warn#][!UpdateMeter MeterRamVal][!UpdateMeter MeterRamBar][!Redraw]
IfCondition3=(MRamPct<#RamWarn#)
IfTrueAction3=[!SetOption MeterRamVal FontColor #Text#][!SetOption MeterRamBar BarColor #Accent#][!UpdateMeter MeterRamVal][!UpdateMeter MeterRamBar][!Redraw]
[MRamUsedGB]
Measure=Calc
Formula=(MRam/1073741824)
DynamicVariables=1
[MRamTotalGB]
Measure=Calc
Formula=(MRamTotal/1073741824)
DynamicVariables=1

; ---- DISKS ----
[MDiskC]
Measure=FreeDiskSpace
Drive=C:

; ---- NETWORK ----
[MNetIn]
Measure=NetIn
[MNetOut]
Measure=NetOut

; ---- CLOCK / UPTIME ----
[MTime]
Measure=Time
Format=%H:%M
[MDate]
Measure=Time
Format=%a  %d %b
[MUptime]
Measure=Uptime
Format=%4!i!d %3!i!h %2!i!m

